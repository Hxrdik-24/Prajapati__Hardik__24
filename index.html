<script>
(()=>{'use strict';
/* ============ CONFIG & DATA (edit these) ============ */
const ME={gh:'https://github.com/YOUR-USERNAME',li:'https://www.linkedin.com/in/hardik-prajapati-475231390',mail:'you@example.com'};
const repo=n=>ME.gh+'/'+n;
const NODES=[
{id:'about',kind:'lotus',label:'About',pos:[.5,.46],posP:[.5,.44],title:'Hi, I’m Hardik',body:['First-year BCA student in Ahmedabad. I build full-stack web apps, then try to break them, then fix them.','I like security work that ends with something real: a tool, a patch, a write-up.']},
{id:'skills',kind:'pebbles',label:'Skills',pos:[.2,.26],posP:[.24,.26],title:'Skills',body:['Python is my daily language. Around it: Flask, HTML, CSS and JavaScript.','PostgreSQL (Neon), SQLite, Socket.IO.','Kali Linux, Burp Suite, Wireshark, VS Code.']},
{id:'nexa',kind:'pad',label:'Nexa-IDS',pos:[.3,.64],posP:[.3,.6],title:'Nexa-IDS',body:['Intrusion-detection work under the Nexa name, which began in Jan 2025 as an AI assistant.'],meta:[['Tech','Python'],['Status','In progress']],links:[['GitHub',repo('Nexa-IDS')]]},
{id:'blog',kind:'pad',label:'H-24 Blog',pos:[.66,.7],posP:[.7,.66],title:'H-24 Blog',body:['A Flask blog with login, rate limiting, caching, image uploads and email flows.'],meta:[['Tech','Flask, Brevo, Flask-Caching, Flask-Limiter, bcrypt, Cloudinary'],['Status','Live']],links:[['GitHub',repo('H-24_Blog')],['Live','https://h-24-blog.onrender.com']]},
{id:'hub',kind:'pad',label:'H-24 Hub',pos:[.8,.3],posP:[.76,.3],title:'H-24 Hub',body:['A personal cloud that stores encrypted files through Telegram, driven from a Rich terminal UI.'],meta:[['Tech','Python, Pyrogram, Fernet (AES), Rich'],['Status','Working']],links:[['GitHub',repo('H-24-Hub')]]},
{id:'bugdash',kind:'pad',label:'BugDash',pos:[.6,.2],posP:[.5,.16],title:'BugDash',body:['A CLI vulnerability notebook: 35+ OWASP vulnerabilities and 100+ categorised payloads, with hashed login and lockout.'],meta:[['Tech','Python, SQLite'],['Status','Next: React + Tailwind dashboard']],links:[['GitHub',repo('BugDash')]]},
{id:'face',kind:'pad',label:'Face Security',pos:[.46,.84],posP:[.5,.8],title:'H-24 Face Security',body:['Face lock that checks several frames, auto-locks after failed attempts, saves intruder photos and alerts me on Telegram.'],meta:[['Tech','Python, DeepFace, Telegram API'],['Status','v2']],links:[['GitHub',repo('H-24-Face-Security')]]},
{id:'path',kind:'stones',label:'Learning',pos:[.1,.5],posP:[.18,.44],title:'Learning journey',body:['Jan 2025: started Nexa, my first AI assistant.','Dec 2025: WolfNet, a socket-based LAN chat.','2026: picoCTF rank #2,669 (118 solves), Phantom Flags rank #10, BugDash, Face Security, H-24 Hub.','Next: an evening remote internship, more bug bounty, deeper web security.']},
{id:'cyber',kind:'lantern',label:'Cybersecurity',pos:[.9,.56],posP:[.82,.48],title:'Cybersecurity',body:['CTFs, OWASP-style testing and hardening my own projects. H-24 Portal scores A+ on securityheaders.com.','My first HackerOne report (clickjacking) came back a duplicate. Still counts as a start.']},
{id:'github',kind:'planks',label:'GitHub',pos:[.32,.4],posP:[.28,.36],title:'GitHub',body:['Most of what’s in this pond lives there, half-finished ideas included.'],links:[['Open my GitHub',ME.gh]]},
{id:'contact',kind:'boat',label:'Contact',pos:[.86,.86],posP:[.8,.9],title:'Say hello',body:['Open to a part-time, work-from-home evening internship. Message me.'],links:[['Email','mailto:'+ME.mail],['LinkedIn',ME.li]]}
];
NODES.push(
{id:'portal',kind:'pad',label:'H-24 Portal',pos:[.7,.5],posP:[.62,.56],title:'H-24 Portal',body:['A Flask portal with a world chat, a read-only viewer login, an IP block/unblock panel and a steganographic OTP flow.'],meta:[['Tech','Flask, Flask-SocketIO, Resend, Flask-Limiter'],['Status','A+ on securityheaders.com']],links:[['GitHub',repo('H-24-Portal')]]},
{id:'certs',kind:'scroll',label:'Certificates',pos:[.16,.66],posP:[.16,.7],title:'Certificates',body:['CCC and C language certificates.','Hackathon participation: Enfowiz Solution and Lok Jagrutti Kendra University.']},
{id:'goals',kind:'bottle',label:'Message in a bottle',pos:[.4,.24],posP:[.3,.16],title:'Where I’m heading',body:['Land a part-time internship, keep climbing CTF ranks, find and report real bugs, and turn my side projects into things other people use.']});
const CFG={koi:7,fleeR:130,koiMax:62,fleeMax:190};

/* ============ UTILS ============ */
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,k)=>a+(b-a)*k;
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const cv=$('#w'),cx=cv.getContext('2d');
let W=0,H=0,S=1,portrait=false,clock=0;
const ptr={x:-999,y:-999,on:false,lx:0,ly:0,lt:0};
const world={season:'summer',t:[58,112,104],b:[30,72,74],ka:1,slow:1,ice:0,cat:0,sun:1,low:0,mist:0,fl:0,gather:0,food:[],rip:[],dusk:false,opened:new Set()};
const npos=n=>{const p=portrait?n.posP:n.pos;return[p[0]*W,p[1]*H]};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),3800)}
const ripple=(x,y,m=70)=>world.rip.length<(world.season==='rain'?70:24)&&world.rip.push({x,y,r:2,m});

/* ============ KOI (steering: wander, flee, seek food, separation, edge avoid, gather) ============ */
const COL=[['#e9e2d0','#d9552f'],['#e08a3c','#f3ead8'],['#f0ece2','#2c2c2c'],['#d9552f','#f3ead8'],['#e9b04a','#f3ead8'],['#efe6d3','#e08a3c']];
const HW=[2.6,3.4,3.8,3.7,3.3,2.8,2.3,1.8,1.4,1,.8,.6];
class Koi{
 constructor(i,tiny){this.i=i;this.tiny=tiny;this.sz=(tiny?.42:rnd(.85,1.15))*S;this.c=tiny?['#f6f2e8','#f6f2e8']:COL[i%COL.length];
  this.p={x:rnd(0,W),y:rnd(0,H)};const a=rnd(0,6.28);this.v={x:Math.cos(a)*30,y:Math.sin(a)*30};this.wa=0;this.ph=rnd(0,6);this.L=4.6*this.sz;
  this.seg=HW.map(()=>({x:this.p.x,y:this.p.y}));this.hits=0}
 update(dt,all){
  const p=this.p,v=this.v,f={x:0,y:0};let max=CFG.koiMax*(this.tiny?1.3:1)*world.slow;
  this.wa=(this.wa+(Math.random()-.5)*3*dt)*.985;const h=Math.atan2(v.y,v.x)+this.wa;f.x+=Math.cos(h)*.5;f.y+=Math.sin(h)*.5;
  if(world.gather>0){const a=clock*.5+this.i*6.283/all.length,R=Math.min(W,H)*.22,tx=W/2+Math.cos(a)*R-p.x,ty=H/2+Math.sin(a)*R-p.y,d=Math.hypot(tx,ty)||1;f.x+=tx/d*2;f.y+=ty/d*2;max*=1.7}
  else if(world.food.length){let b=null,bd=420;for(const fd of world.food){const d=Math.hypot(fd.x-p.x,fd.y-p.y);if(d<bd){bd=d;b=fd}}
   if(b){if(bd<10){b.life=0;ripple(b.x,b.y,34)}else{f.x+=(b.x-p.x)/bd*1.3;f.y+=(b.y-p.y)/bd*1.3;max*=1.25}}}
  if(ptr.on){const dx=p.x-ptr.x,dy=p.y-ptr.y,d=Math.hypot(dx,dy)||1;if(d<CFG.fleeR){const k=1-d/CFG.fleeR;f.x+=dx/d*3*k;f.y+=dy/d*3*k;max=mix(max,CFG.fleeMax,k)}}
  const m=70;if(p.x<m)f.x+=(m-p.x)/m*2;if(p.x>W-m)f.x-=(p.x-W+m)/m*2;if(p.y<m)f.y+=(m-p.y)/m*2;if(p.y>H-m)f.y-=(p.y-H+m)/m*2;
  for(const o of all){if(o===this)continue;const dx=p.x-o.p.x,dy=p.y-o.p.y,d=Math.hypot(dx,dy);if(d>0&&d<50*S){f.x+=dx/d*.8;f.y+=dy/d*.8}}
  v.x+=f.x*260*dt;v.y+=f.y*260*dt;let sp=Math.hypot(v.x,v.y);
  if(sp>max){v.x*=max/sp;v.y*=max/sp;sp=max}if(sp<20){v.x=v.x/(sp||1)*20;v.y=v.y/(sp||1)*20;sp=20}
  v.x*=.996;v.y*=.996;p.x+=v.x*dt;p.y+=v.y*dt;this.ph+=dt*(3.5+sp*.055);if(Math.random()<dt*.05)ripple(p.x+v.x*.15,p.y+v.y*.15,26);
  const s=this.seg;s[0].x=p.x;s[0].y=p.y;
  for(let i=1;i<s.length;i++){const dx=s[i].x-s[i-1].x,dy=s[i].y-s[i-1].y,d=Math.hypot(dx,dy)||1;s[i].x=s[i-1].x+dx/d*this.L;s[i].y=s[i-1].y+dy/d*this.L}}
 draw(){
  const s=this.seg,n=s.length,sz=this.sz,L=[],R=[],P=[];
  for(let i=0;i<n;i++){const a=s[Math.max(i-1,0)],b=s[Math.min(i+1,n-1)];let dx=a.x-b.x,dy=a.y-b.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
   const nx=-dy,ny=dx,w=Math.sin(this.ph-i*.55)*sz*.9*(i/n)*1.3,x=s[i].x+nx*w,y=s[i].y+ny*w;P.push([x,y,dx,dy]);
   L.push([x+nx*HW[i]*sz,y+ny*HW[i]*sz]);R.push([x-nx*HW[i]*sz,y-ny*HW[i]*sz])}
  const t=P[n-1],tl=sz*5;cx.globalAlpha=.7*world.ka;cx.fillStyle=this.c[0];cx.beginPath();cx.moveTo(t[0],t[1]);
  cx.lineTo(t[0]-t[2]*tl+t[3]*sz*3.5,t[1]-t[3]*tl-t[2]*sz*3.5);cx.lineTo(t[0]-t[2]*tl*.6,t[1]-t[3]*tl*.6);cx.lineTo(t[0]-t[2]*tl-t[3]*sz*3.5,t[1]-t[3]*tl+t[2]*sz*3.5);cx.fill();
  const q=P[2],ang=Math.atan2(q[3],q[2]);for(const sg of[-1,1]){cx.beginPath();cx.ellipse(q[0]-q[3]*sg*sz*3,q[1]+q[2]*sg*sz*3,sz*3,sz*1.1,ang+sg*.7,0,6.283);cx.fill()}
  cx.globalAlpha=.95*world.ka;cx.beginPath();cx.moveTo(L[0][0],L[0][1]);for(let i=1;i<n;i++)cx.lineTo(L[i][0],L[i][1]);for(let i=n-1;i>=0;i--)cx.lineTo(R[i][0],R[i][1]);cx.closePath();cx.fill();
  cx.fillStyle=this.c[1];for(const i of[2,4,6]){cx.beginPath();cx.arc(P[i][0]+(i-4)*.3,P[i][1],sz*(i===4?2.2:1.5),0,6.283);cx.fill()}cx.globalAlpha=1}
}

/* ============ DRAGONFLY (state machine: cruise → hover → cruise | leave → away → return) ============ */
const dfly={p:{x:-80,y:H/2},v:{x:80,y:0},st:'away',t:1.5,tg:null,ph:0,loop:0,hd:0,nid:null,clicks:0};
function dflyTarget(){const n=NODES[Math.floor(Math.random()*NODES.length)],[x,y]=npos(n);dfly.tg={x:x+rnd(-40,40),y:y+rnd(-40,40)-30*S};dfly.nid=n.id}
function dflyUpdate(dt){
 const d=dfly,p=d.p,v=d.v;d.t-=dt;let max=110*S,arrive=90;
 if(d.st==='away'){if(d.t<=0){const side=Math.random()<.5?-1:1;p.x=side<0?-60:W+60;p.y=rnd(H*.2,H*.8);v.x=-side*-90;v.y=rnd(-30,30);dflyTarget();d.st='cruise'}return}
 if(d.st==='hover'){max=18;if(d.t<=0){if(Math.random()<.5){dflyTarget();d.st='cruise'}else{d.tg={x:p.x<W/2?-120:W+120,y:rnd(0,H)};d.st='leave'}}}
 if(d.st==='cruise'&&Math.hypot(d.tg.x-p.x,d.tg.y-p.y)<24){d.st='hover';d.t=rnd(2.5,5)}
 if(d.st==='leave'&&(p.x<-90||p.x>W+90)){d.st='away';d.t=rnd(6,14);return}
 if(d.loop>0){d.loop-=dt;const a=Math.atan2(v.y,v.x)+7*dt,sp=Math.hypot(v.x,v.y)||120;v.x=Math.cos(a)*sp;v.y=Math.sin(a)*sp}
 else{
  const dx=d.tg.x-p.x,dy=d.tg.y-p.y,dist=Math.hypot(dx,dy)||1,burst=Math.sin(clock*.7+d.hd)>.85?1.7:1,want=max*burst*Math.min(1,dist/arrive);
  let fx=dx/dist*want-v.x,fy=dy/dist*want-v.y;const fl=Math.hypot(fx,fy),mf=d.st==='hover'?60:220;if(fl>mf){fx*=mf/fl;fy*=mf/fl}
  d.hd+=(Math.random()-.5)*dt*3;const sp=Math.hypot(v.x,v.y)||1;fx+=-v.y/sp*Math.sin(clock*2.3+d.hd)*25;fy+=v.x/sp*Math.sin(clock*2.3+d.hd)*25;
  if(ptr.on){const ex=p.x-ptr.x,ey=p.y-ptr.y,ed=Math.hypot(ex,ey)||1;if(ed<90){fx+=ex/ed*300;fy+=ey/ed*300}}
  v.x+=fx*dt;v.y+=fy*dt}
 p.x+=v.x*dt;p.y+=v.y*dt;d.ph+=dt*(d.st==='hover'?70:48);if(d.st==='hover'&&Math.random()<dt*.8)ripple(p.x+8,p.y+16,22)}
function dflyDraw(){
 const d=dfly;if(d.st==='away')return;const{x,y}=d.p,a=Math.atan2(d.v.y,d.v.x),s=S,sp=Math.hypot(d.v.x,d.v.y);
 for(const sh of[1,0]){cx.save();cx.translate(x+(sh?10:0),y+(sh?18:0));cx.rotate(a);
  const al=sh?.14:1,c=sh?'#000':'#2b7f8c';cx.globalAlpha=al;cx.fillStyle=c;cx.fillRect(-26*s,-1.2*s,32*s,2.4*s);cx.beginPath();cx.ellipse(8*s,0,5*s,2.6*s,0,0,6.283);cx.fill();
  cx.globalAlpha=sh?.08:.42;cx.fillStyle=sh?'#000':'#fff';const fl=Math.abs(Math.cos(d.ph)),fl2=Math.abs(Math.cos(d.ph+1.6));
  for(const sg of[-1,1]){cx.beginPath();cx.ellipse(3*s,sg*11*s*fl,13*s,3.6*s,sg*.25,0,6.283);cx.fill();cx.beginPath();cx.ellipse(-4*s,sg*10*s*fl2,12*s,3.2*s,sg*.35,0,6.283);cx.fill()}
  cx.restore()}cx.globalAlpha=1;void sp}

/* ============ WORLD RENDER ============ */

  CATS.forEach((c,i)=>{const x0=c.x*sc,dx=tx-(rx+x0),dy=ty-(ry-50*sc),d=Math.hypot(dx,dy)||1,g=OC[i].getContext('2d');
   g.clearRect(0,0,110,110);catShape(g,c,{x:dx/d,y:c.eat>0?1:dy/d},clock);cx.globalAlpha=world.cat;cx.drawImage(OC[i],x0-55*sc,-104*sc,110*sc,110*sc);cx.globalAlpha=1;
   if(c.eat>0){const fx=x0+(c.st?22:-22)*sc,al=Math.min(1,c.eat);ell(fx,-3*sc,9*sc,3.4*sc,.15,'#cfd8dc',al);cx.globalAlpha=al;cx.fillStyle='#cfd8dc';cx.beginPath();cx.moveTo(fx+8*sc,-3*sc);cx.lineTo(fx+14*sc,-7*sc);cx.lineTo(fx+14*sc,sc);cx.fill();cx.globalAlpha=1}})}
 cx.restore();if(world.cat<.02)return;
 let wob=0;for(const r of world.rip)if(Math.hypot(r.x-rx,r.y-ry)<r.m+90)wob+=1.5;wob=Math.min(wob,5);
 CATS.forEach((c,i)=>{const ox=rx+c.x*sc-55*sc;for(let sy=0;sy<104;sy+=2){cx.globalAlpha=world.cat*.34*(sy/104);cx.drawImage(OC[i],0,sy,110,2,ox+Math.sin(clock*2.4+sy*.32+i)*(1.2+wob)*sc,ry+17*sc+(104-sy)*sc*.8,110*sc,2*sc*.8+.6)}});cx.globalAlpha=1}
function catClick(e){if(world.cat<.5)return false;const[rx,ry]=rockPos(),sc=rockSc();if(Math.abs(e.clientX-rx)>60*sc||e.clientY<ry-90*sc||e.clientY>ry+10*sc)return false;
 const c=CATS[e.clientX<rx?0:1];c.fl=1;c.seen=1;ripple(rx,ry+20*sc,50);toast(CATS.every(k=>k.seen)?'Two cats, one pond. They’ve agreed to share it.':c.st?'Mrrp. The orange one wants fish.':'The black one blinks slowly. That means trust.');return true}
function feedCats(){if(world.cat<.5)return;const[rx,ry]=rockPos();ripple(rx,ry+22*rockSc(),44);CATS.forEach((c,i)=>setTimeout(()=>{c.eat=3.4},i*600));toast('Nom nom. They approve.')}
function setSeason(n,quiet){world.season=n;document.querySelectorAll('.seasons button[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===n));try{localStorage.setItem('pond-season',n)}catch(e){}
 $('#feedBtn').hidden=n!=='night';sndTune();if(!quiet)toast(MSG[n]);if(reduced){for(let i=0;i<120;i++)step(.05);render()}}
function initSeason(){let n;try{n=localStorage.getItem('pond-season')}catch(e){}const h=new Date().getHours();if(!SEA[n]||n==='dusk')n=(h>=19||h<6)?'night':'summer';
 document.querySelectorAll('.seasons button[data-s]').forEach(b=>b.onclick=()=>setSeason(b.dataset.s));setSeason(n,true);const g=SEA[n];Object.assign(world,{t:[...g.t],b:[...g.b],ka:g.ka,slow:g.slow,ice:g.ice,cat:g.cat,sun:g.sun,low:g.low,mist:g.mist})}

/* ============ FROG (sits on a pad, hops away from the cursor, croaks at night) ============ */
const FR={st:'sit',n:-1,x:0,y:0,fx:0,fy:0,tx:0,ty:0,u:0,t:8,a:0,cr:0};
const padIdx=()=>NODES.map((n,i)=>n.kind==='pad'?i:-1).filter(i=>i>=0),frogPad=i=>{const[x,y]=npos(NODES[i]);return[x,y-1]};
function frogJump(){const ids=padIdx().filter(i=>i!==FR.n),j=ids[Math.floor(rnd(0,ids.length))];[FR.tx,FR.ty]=frogPad(j);FR.fx=FR.x;FR.fy=FR.y;FR.n=j;FR.u=0;FR.st='jump';FR.a=Math.atan2(FR.ty-FR.fy,FR.tx-FR.fx)}
function frogStep(dt){if(FR.n<0){FR.n=padIdx()[0];[FR.x,FR.y]=frogPad(FR.n)}
 if(FR.st==='sit'){[FR.x,FR.y]=frogPad(FR.n);FR.t-=dt;FR.cr=Math.max(0,FR.cr-dt);
  if((ptr.on&&Math.hypot(ptr.x-FR.x,ptr.y-FR.y)<70)||FR.t<=0)frogJump();
  else if(world.cat>.5&&Math.random()<dt*.15){FR.cr=.6;if(Snd.on&&Snd.x)sndOsc('square',160,Snd.x.currentTime,.12,.02,110)}}
 else{FR.u+=dt/.7;if(FR.u>=1){FR.st='sit';FR.t=rnd(8,16);FR.x=FR.tx;FR.y=FR.ty;ripple(FR.x,FR.y,42)}else{FR.x=mix(FR.fx,FR.tx,FR.u);FR.y=mix(FR.fy,FR.ty,FR.u)-Math.sin(FR.u*Math.PI)*40*S}}}
function frogDraw(){const{x,y,a,st,u}=FR,s=S,c=Math.cos(a),n=Math.sin(a),lift=st==='jump'?Math.sin(u*Math.PI):0;
 if(st==='jump')ell(mix(FR.fx,FR.tx,u)+2,mix(FR.fy,FR.ty,u)+4,8*s,5*s,0,'#000',.12);else ell(x+2,y+3,9*s,6*s,0,'#000',.2);
 const L=(px,py,rx,ry,r,col)=>ell(x+c*px-n*py,y+n*px+c*py,rx*s,ry*s,a+r,col),cr=FR.cr>0?1+.6*Math.sin(FR.cr*20):1;
 L(-7,6,6,2.6,.6,'#4d8540');L(-7,-6,6,2.6,-.6,'#4d8540');L(0,0,9,6.5,0,'#5f9a4a');L(8,0,5.5,5,0,'#6fb056');L(12,0,3*cr,2.4*cr,0,'#d9e6a8');L(9,3.6,2,2,0,'#1c2b1a');L(9,-3.6,2,2,0,'#1c2b1a');void lift}
/* ============ SIMULATION LOOP ============ */
let kois=[],last=0,raf=0;
function step(dt){
 clock+=dt;seasonStep(dt);
 if(world.gather>0)world.gather-=dt;
 for(const o of kois)o.update(dt,kois);
 for(const r of world.rip)r.r+=44*dt;world.rip=world.rip.filter(r=>r.r<r.m);
 for(const f of world.food)f.life-=dt;world.food=world.food.filter(f=>f.life>0);
 dflyUpdate(dt);partStep(dt);raftStep(dt);frogStep(dt);
 for(const n of NODES)n.h+=((n.hv?1:0)-n.h)*Math.min(1,dt*10)}
function frame(ts){const dt=Math.min((ts-last)/1000,.05);last=ts;try{step(dt);render()}catch(e){console.error(e)}raf=requestAnimationFrame(frame)}
function start(){cancelAnimationFrame(raf);last=performance.now();if(reduced){for(let i=0;i<120;i++)step(.05);render()}else raf=requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{document.hidden?cancelAnimationFrame(raf):(!plainOn&&start())});

/* ============ UI: hotspots, panel, plain version ============ */
const hots=$('#hots'),panel=$('#panel'),pbody=$('#pbody');let opener=null,plainOn=false;
function el(t,txt,cls){const e=document.createElement(t);if(txt)e.textContent=txt;if(cls)e.className=cls;return e}
function content(n,h2id){const f=document.createDocumentFragment(),h=el('h2',n.title);if(h2id)h.id=h2id;f.append(h);n.body.forEach(t=>f.append(el('p',t)));
 if(n.meta){const dl=el('dl');n.meta.forEach(([a,b])=>{dl.append(el('dt',a),el('dd',b))});f.append(dl)}
 if(n.links){const d=el('div','','links');n.links.forEach(([t,u])=>{const a=el('a',t);a.href=u;if(u.startsWith('http'))a.target='_blank',a.rel='noopener';d.append(a)});f.append(d)}return f}
function openNode(n,btn){opener=btn;pbody.replaceChildren(content(n,'pt'));panel.classList.add('open');panel.setAttribute('aria-hidden','false');$('#close').focus();
 world.opened.add(n.id);if(world.opened.size===NODES.length&&!world.dusk){world.dusk=true;toast('You’ve seen the whole pond. The light is changing.')}}
function closePanel(){panel.classList.remove('open');panel.setAttribute('aria-hidden','true');opener&&opener.focus()}
$('#close').onclick=closePanel;
addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('open'))closePanel();
 keyBuf=(keyBuf+e.key.toLowerCase()).slice(-3);if(keyBuf==='h24'){world.gather=7;toast('The koi remember the name.')}});let keyBuf='';
NODES.forEach(n=>{n.h=0;const b=el('button');b.className='hot';b.setAttribute('aria-label',n.label+': '+n.title);n.btn=b;
 b.onmouseenter=b.onfocus=()=>{n.hv=true;reduced&&render()};b.onmouseleave=b.onblur=()=>{n.hv=false;reduced&&render()};b.onclick=()=>openNode(n,b);hots.append(b)});
function layout(){NODES.forEach(n=>{const[x,y]=npos(n);n.btn.style.left=x+'px';n.btn.style.top=y+'px'})}
const plain=$('#plain');{const w=el('div');w.append(el('h1','Hardik Prajapati'));NODES.forEach(n=>{const s=el('section');s.append(content(n));w.append(s)});plain.append(w)}
$('#plainBtn').onclick=e=>{plainOn=!plainOn;plain.hidden=!plainOn;cv.style.visibility=plainOn?'hidden':'';hots.hidden=plainOn;e.target.textContent=plainOn?'Back to the pond':'Plain version';e.target.setAttribute('aria-pressed',plainOn);plainOn?cancelAnimationFrame(raf):start()};
plain.hidden=true;

/* ============ SOUND (procedural WebAudio, off by default) ============ */
const SND={rain:{t:'highpass',f:1400,g:.3,pad:[98,146.8,196],pg:.02},summer:{t:'lowpass',f:700,g:.1,pad:[220,277.2,329.6],pg:.035},winter:{t:'bandpass',f:450,g:.22,pad:[130.8,196,261.6],pg:.04},night:{t:'lowpass',f:260,g:.1,pad:[110,130.8,164.8],pg:.04}};SND.dusk=SND.summer;SND.autumn={t:'lowpass',f:520,g:.13,pad:[196,246.9,293.7],pg:.035};
const Snd={on:false,x:null};
function sndTune(){const x=Snd.x;if(!x)return;const p=SND[world.season],t=x.currentTime;Snd.nf.type=p.t;Snd.nf.frequency.setTargetAtTime(p.f,t,.8);Snd.ng.gain.setTargetAtTime(p.g,t,.8);Snd.pad.forEach((o,i)=>o.frequency.setTargetAtTime(p.pad[i],t,1.2));Snd.pg.gain.setTargetAtTime(p.pg,t,1.2)}
function sndOsc(type,f,t0,dur,g,f2){const x=Snd.x,o=x.createOscillator(),e=x.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);e.gain.setValueAtTime(0,t0);e.gain.linearRampToValueAtTime(g,t0+.01);e.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(e);e.connect(Snd.m);o.start(t0);o.stop(t0+dur+.05)}
function sndEvent(){if(!Snd.on)return;const t=Snd.x.currentTime,s=world.season,r=Math.random();
 if(s==='summer'||s==='dusk'){if(r<.45)for(let i=0;i<2+Math.floor(rnd(0,3));i++){const f=rnd(2400,3600);sndOsc('sine',f,t+i*.11,.09,.03,f*rnd(.8,1.25))}}
 else if(s==='winter'){if(r<.4){const f=[523.3,587.3,659.3,784,880][Math.floor(rnd(0,5))];sndOsc('sine',f,t,2.6,.05);sndOsc('sine',f*2.01,t,1.2,.015)}}
 else if(s==='rain'){if(r<.5)sndOsc('sine',rnd(600,1100),t,.08,.03,rnd(250,400))}
 else if(s==='autumn'){if(r<.35)sndOsc('triangle',[261.6,293.7,349.2,392][Math.floor(rnd(0,4))],t,1.4,.03)}
 else if(r<.8)for(let i=0;i<5;i++)sndOsc('sine',4300,t+i*.06,.035,.012)}
$('#sndBtn').onclick=e=>{Snd.on=!Snd.on;const b=e.currentTarget;b.setAttribute('aria-pressed',Snd.on);b.textContent='Sound: '+(Snd.on?'on':'off');
 if(Snd.on&&!Snd.x){const A=window.AudioContext||window.webkitAudioContext;if(!A){Snd.on=false;return}const x=Snd.x=new A();Snd.m=x.createGain();Snd.m.gain.value=0;Snd.m.connect(x.destination);
  const n=x.sampleRate*2,bf=x.createBuffer(1,n,x.sampleRate),d=bf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=x.createBufferSource();src.buffer=bf;src.loop=true;Snd.nf=x.createBiquadFilter();Snd.ng=x.createGain();Snd.ng.gain.value=0;src.connect(Snd.nf);Snd.nf.connect(Snd.ng);Snd.ng.connect(Snd.m);src.start();
  Snd.pg=x.createGain();Snd.pg.gain.value=0;Snd.pg.connect(Snd.m);Snd.pad=[0,1,2].map(()=>{const o=x.createOscillator();o.type='sine';o.connect(Snd.pg);o.start();return o});
  sndTune();setInterval(sndEvent,900)}
 if(Snd.x){Snd.x.resume();Snd.m.gain.setTargetAtTime(Snd.on?.7:0,Snd.x.currentTime,.4)}};
document.addEventListener('visibilitychange',()=>{if(Snd.x)document.hidden?Snd.x.suspend():Snd.on&&Snd.x.resume()});
/* ============ INPUT ============ */
addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY;ptr.on=true;
 if(e.pointerType==='mouse'){const t=performance.now();if(t-ptr.lt>140&&Math.hypot(e.clientX-ptr.lx,e.clientY-ptr.ly)>45){ripple(e.clientX,e.clientY,44);ptr.lx=e.clientX;ptr.ly=e.clientY;ptr.lt=t}}});
addEventListener('pointerleave',()=>ptr.on=false);
cv.addEventListener('pointerdown',e=>{ptr.x=e.clientX;ptr.y=e.clientY;ptr.on=e.pointerType!=='mouse'?true:ptr.on;if(e.pointerType!=='mouse')setTimeout(()=>ptr.on=false,700);
 $('#hint').classList.add('gone');if(raftDown(e))return;
 if(Math.hypot(e.clientX-dfly.p.x,e.clientY-dfly.p.y)<30&&dfly.st!=='away'){dfly.loop=1.2;if(++dfly.clicks===3){toast('The dragonfly drops a tiny key. A terminal appears.');termToggle(true)}else if(dfly.clicks===1)toast('Bzzz. Not now, I’m on patrol.');return}
 const b=kois[kois.length-1];if(Math.hypot(e.clientX-b.p.x,e.clientY-b.p.y)<26){if(++b.hits===3)toast('You found Byte. Small fish, big packets.');return}
 if(world.food.length<6){world.food.push({x:e.clientX,y:e.clientY,life:14});ripple(e.clientX,e.clientY,60)}
 ptr.on=false});
addEventListener('pointermove',e=>{if(drag&&!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6)drag.moved=true});
addEventListener('pointerup',()=>{if(drag&&!drag.moved)catClick({clientX:drag.sx,clientY:drag.sy});drag=null});addEventListener('pointercancel',()=>{drag=null});
$('#feedBtn').onclick=feedCats;
const term=$('#term'),tout=$('#tout'),tin=$('#tin');let tOpen=false;
const tLine=t=>{tout.append(el('div',t));tout.scrollTop=1e9};
function termToggle(o){tOpen=o===undefined?!tOpen:o;term.hidden=!tOpen;if(tOpen){if(!tout.childNodes.length)tLine('pond shell. type help');tin.focus()}else tin.blur()}
const CMD={help:()=>'about, skills, projects, contact, github, moon, season <name>, feed, gather, ls, clear, exit',
 about:()=>NODES[0].body.join('\n'),skills:()=>NODES[1].body.join('\n'),projects:()=>NODES.filter(n=>n.kind==='pad').map(n=>'• '+n.title).join('\n'),
 contact:()=>ME.mail+'\n'+ME.li,github:()=>ME.gh,moon:()=>{const M=moonCalc();return M.nm+', '+Math.round(M.il*100)+'% lit'},ls:()=>NODES.map(n=>n.id).join('  '),
 whoami:()=>'a visitor, hopefully a friendly one',sudo:()=>'nice try.',gather:()=>{world.gather=7;return 'the koi remember the name.'},
 feed:()=>{if(world.cat<.5)return 'the cats only come out at night.';feedCats();return 'fish served.'},
 season:a=>SEA[a]&&a!=='dusk'?(setSeason(a,true),'season → '+a):'try: summer, rain, winter, autumn, night',
 clear:()=>{tout.replaceChildren();return ''},exit:()=>{termToggle(false);return ''}};
tin.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape')return termToggle(false);
 if(e.key==='Enter'){const v=tin.value.trim();tin.value='';if(!v)return;tLine('$ '+v);const[c,...a]=v.toLowerCase().split(/\s+/),r=Object.hasOwn(CMD,c)?CMD[c](a[0]):'command not found: '+c;if(r)tLine(r)}});
addEventListener('keydown',e=>{if(e.key==='`'&&e.target.tagName!=='INPUT'){e.preventDefault();termToggle()}});
function resize(){const D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);portrait=H>W;S=clamp(Math.min(W,H)/620,.75,1.35);layout();mkIce();rockFit();if(reduced)render()}
addEventListener('resize',resize);resize();
kois=Array.from({length:CFG.koi},(_,i)=>new Koi(i,i===CFG.koi-1));
setTimeout(()=>$('#hint').classList.add('gone'),16000);
initSeason();start();
})();
</script>
