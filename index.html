<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Hardik Prajapati — BCA student building software, security tools and experimental projects.">
  <title>Hardik Prajapati · The Pond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="pond" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <header class="intro">
    <p class="eyebrow">THE POND · HARDIK PRAJAPATI</p>
    <h1>Software, security tools<br><em>and experiments.</em></h1>
    <p class="lede">A BCA student building real projects, learning in public, and looking closely at how things break — then fixing them.</p>
  </header>
  <nav class="controls" aria-label="Portfolio controls">
    <button id="plain-toggle" type="button" aria-pressed="false">Plain version</button>
    <button id="sound-toggle" type="button" aria-pressed="false">Sound: off</button>
  </nav>
  <p id="hint" class="hint">Click the pond objects to explore · click the water to feed the koi</p>
  <div id="hotspots" aria-label="Pond navigation"></div>
  <div class="weather" role="group" aria-label="Pond atmosphere">
    <button type="button" data-season="summer" aria-pressed="true">Summer</button>
    <button type="button" data-season="rain" aria-pressed="false">Rain</button>
    <button type="button" data-season="winter" aria-pressed="false">Winter</button>
    <button type="button" data-season="night" aria-pressed="false">Night</button>
  </div>
  <aside id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" aria-hidden="true">
    <button id="panel-close" class="close" type="button">Close</button>
    <div id="panel-content"></div>
  </aside>
  <main id="plain" class="plain" hidden></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
